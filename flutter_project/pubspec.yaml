name: pulsosala
description: "PulsoSala - Sistema de telemetría y monitoreo de salones y terminales con Supabase Realtime"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Supabase Flutter Client for Authentication, Database & Realtime
  supabase_flutter: ^2.8.0
  # State Management
  flutter_riverpod: ^2.5.1
  # Typography & Design
  google_fonts: ^6.2.1
  # Icons
  lucide_icons: ^0.257.0
  # Animations & UI
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
